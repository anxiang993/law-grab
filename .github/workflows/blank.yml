name: Law_Sync_Bot
on:
  schedule:
    - cron: '0 0 * * *' # 每天早上8点自动运行
  workflow_dispatch:   # 允许你手动点击按钮运行

jobs:
  run_bot:
    runs-on: ubuntu-latest
    steps:
      - name: 检查代码
        uses: actions/checkout@v3
      - name: 安装Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: 安装依赖
        run: pip install requests beautifulsoup4
      - name: 执行抓取
        run: python monitor.py
      - name: 保存文件回仓库
        run: |
          git config --global user.name "LawBot"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "自动更新法规库" || exit 0
          git push
